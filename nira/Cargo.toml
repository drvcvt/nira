[package]
name = "nira"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
dioxus = { workspace = true, features = ["desktop"] }
components = { workspace = true }
pages = { workspace = true }
hooks = { workspace = true }
player = { workspace = true }
config = { workspace = true }
provider-soundcloud = { workspace = true }
provider-spotify = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
# Direct dep only to pin the process-level crypto provider in main() — the
# graph enables BOTH rustls 0.23 providers (librespot → aws-lc-rs, others →
# ring), and rustls panics at the first handshake unless one is installed.
rustls = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { workspace = true }
tokio = { workspace = true }
