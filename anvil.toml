# Anvil offload config for nira.
# Node inventory and machine policy live in ~/.config/anvil/config.toml;
# this file only pins what is nira-specific.

[project]
default_profile = "cargo"
nix_shell = "shell.nix"

[defaults]
# nira's debug target alone runs tens of GB — give the remote workspace room.
disk = "30G"

[tasks.tests]
command = ["cargo", "test", "--workspace"]
sync = "."
sync_back_if_exists = []

[tasks.check]
command = ["cargo", "check", "--workspace"]
sync = "."
sync_back_if_exists = []

[tasks.dev]
command = ["dx", "build", "--desktop", "-p", "nira"]
sync = "."
sync_back = ["target/dx/nira/debug/linux/app"]
sync_back_if_exists = []

[tasks.release]
command = ["dx", "build", "--desktop", "-p", "nira", "--release"]
sync = "."
sync_back = ["target/dx/nira/release/linux/app"]
sync_back_if_exists = []
